[project]
name = "driftless-cli"
version = "0.1.0"
description = "AI-native SDLC outer-loop CLI for coding agents"
readme = "README.md"
authors = [
    { name = "aakashjangidme", email = "ajangid25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
dl = "driftless.cli.main:app"
driftless-cli = "driftless.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "driftless"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP", "PERF", "ASYNC"]
ignore = ["T2", "E501"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
]
