---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify uv.lock is not stale
        run: uv lock --check

      - name: Sync dependencies (including dev)
        run: uv sync --group dev

      - name: Run ruff format check
        run: uv run ruff format --check src/driftless

      - name: Run ruff check
        run: uv run ruff check src/driftless

      - name: Run mypy type check
        run: uv run mypy src/driftless --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-type-check
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify uv.lock is not stale
        run: uv lock --check

      - name: Sync dependencies (including dev)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest --cov=driftless --cov-report=xml --cov-report=html

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: test-results
          path: |
            .coverage
            htmlcov/