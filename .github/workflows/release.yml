---
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-version:
    name: Verify Version Match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag version matches pyproject.toml
        run: |
          TAG_VERSION=$(git describe --tags --abbrev=0 --match='v*' | sed 's/^v//')
          PYPI_VERSION=$(python -c "import tomllib; t=tomllib.load(open('pyproject.toml','rb')); print(t['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPI_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pyproject.toml version $PYPI_VERSION"
            exit 1
          fi

  build:
    name: Build & Upload Artifacts
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify uv.lock is not stale
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: driftless-cli-dist
          path: |
            dist/*
            build/*

  # publish:
  #   name: Publish to PyPI
  #   runs-on: ubuntu-latest
  #   needs: build
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v8 # v8.0.1
  #       with:
  #         name: driftless-cli-dist
  #         path: dist/

  #     - name: Publish to PyPI with attestation
  #       uses: pypa/gh-action-pypi-publish@v1.14.2
  #       with:
  #         attestations: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8 # v8.0.1
        with:
          name: driftless-cli-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*